<style>
*{box-sizing:border-box} :root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#263935;background:#f4f4ef;--ink:#263935;--muted:#576963;--rule:#d8dcd4;--green:#2a6858;--panel:#fffefa}
body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--green);text-underline-offset:3px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2a8069;outline-offset:3px}
.page{max-width:1350px;margin:auto;padding:0 clamp(16px,4vw,58px)}
header{height:76px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--rule)}
.mark{height:39px;width:39px;display:grid;place-items:center;border-radius:13px;background:var(--ink);color:#c1e3d3;font-size:24px;line-height:1}
h1,h2,h3,p{margin:0}h1{font-size:20px;letter-spacing:-.05em}header p{margin-top:2px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(174px,215px) minmax(285px,1fr) minmax(181px,240px);gap:clamp(18px,3.7vw,60px);align-items:start;padding:24px 0}
nav h2,aside h2{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
nav{min-width:0}select{margin:8px 0 14px;padding:10px 28px 10px 11px;border:1px solid #c8cec4;background:var(--panel);border-radius:8px;width:100%;font-size:14px}
.links{max-height:calc(100svh - 242px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.links button{background:transparent;border:0;border-radius:7px;text-align:left;padding:9px 10px;display:flex;align-items:center;gap:8px;font-size:14px}
.links button:hover,.nexts button:hover{background:#e9ece5}.links button[aria-current=true]{color:#215747;background:#dfebe2;font-weight:700}
.links button[aria-current=true]::before{content:"";height:6px;width:6px;border-radius:100%;background:var(--green)}
.stage{display:flex;align-items:center;flex-direction:column;min-width:0}
.phone{width:clamp(278px,min(100%,calc((100svh - 170px) * .5)),390px);padding:5px;border:1px solid #343d39;border-radius:24px;background:#353c37;box-shadow:0 16px 40px #26393522,0 2px 4px #26393512}
.viewport{position:relative;aspect-ratio:1/2;border-radius:18px;background:#fffdf8;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}.viewport::-webkit-scrollbar{display:none}
.scene{width:100%;position:relative;line-height:0}.scene img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hot{border:0;position:absolute;background:transparent;border-radius:6px;appearance:none;padding:0;touch-action:manipulation;cursor:pointer}
.hot:focus-visible,.hot:hover{outline:2px solid #45836a;outline-offset:-2px;background:#76bba92e}
.show .hot{outline:1.5px dashed #407a65;outline-offset:-2px;background:#78bd9d23}
aside{padding-top:12px}aside .name{font-weight:750;letter-spacing:-.055em;font-size:28px;margin:5px 0 12px}
.description{color:var(--muted);font-size:14px;line-height:1.6;word-break:keep-all}
.navline{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap;margin:18px 0 22px}
.util,.nexts button,.mobile-menu{font-size:13px;border:1px solid #c5ccc4;border-radius:8px;padding:9px 11px;background:var(--panel);text-align:left;line-height:1.25}
.util:disabled{color:#858e86;cursor:default}
.nexts{border-top:1px solid var(--rule);padding:16px 0;margin-top:16px}
.nexts div{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.nexts button{color:var(--green)}
.help{border-top:1px solid var(--rule);padding-top:14px;font-size:12px;line-height:1.7;color:var(--muted)}
.counter{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;color:var(--muted)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding:12px 0 16px;font-size:12px;color:var(--muted);line-height:1.55}
.mobile-controls{display:none}
@media(max-width:920px){.layout{gap:22px;grid-template-columns:minmax(190px,240px) minmax(270px,1fr)}.stage{grid-column:2;grid-row:1/3}.links{max-height:29vh}aside{grid-row:2;grid-column:1;padding:0}aside .name{font-size:22px}.layout{grid-template-rows:auto 1fr}}
@media(max-width:660px){.page{padding:0 15px}header{height:56px}header h1{font-size:17px}header .mark{width:30px;height:30px;font-size:19px;border-radius:9px}header p{font-size:10px}.layout{display:flex;flex-direction:column;gap:12px;align-items:center;padding:11px 0 18px}nav{width:100%;display:grid;grid-template-columns:1fr 1.1fr;gap:7px}nav h2,.links{display:none}select{margin:0;font-size:13px;min-width:0}.mobile-controls{display:block}.stage{width:100%}.phone{width:min(100%,390px);border-radius:18px;padding:3px}.viewport{border-radius:14px}aside{width:min(100%,390px);padding:0}.navline{margin:10px 0}.nexts{margin:10px 0 0}aside .name{font-size:19px}.help{padding-top:8px}footer{font-size:11px}}
@media print{header,nav,aside,footer{display:none}.layout,.stage{display:block}.phone{margin:auto;width:320px}.hot{display:none}}

:root{--paper:#fffdf8;--ink:#263935;--green:#286653;--muted:#65766f}
.scene{container-type:inline-size;isolation:isolate}
#live{position:absolute;inset:0;pointer-events:none;line-height:1.35}
#live>*{pointer-events:auto}
#live input,#live button,#live textarea,#live select{font-family:inherit}
#live .over-button{border:0;padding:0;background:transparent;appearance:none;color:transparent;cursor:pointer}
#live .clear-btn{color:var(--ink);font-weight:700;font-size:3.9cqw;background:var(--paper)}
#live .live-field{font-family:inherit;color:var(--ink);background:var(--paper);border:0;border-radius:0;resize:none;padding:0;line-height:1.45;outline-offset:-1px;font-size:max(16px,3.9cqw)}
#live .live-field::placeholder{opacity:1;color:#60736b}

#live .title-field{font-weight:710;font-size:max(16px,5cqw)}
#live .body-field{padding-top:1.7cqw}
#live .count-label,#live .memo-count{display:flex;align-items:center;background:var(--paper);font-size:3.05cqw;color:var(--muted);pointer-events:none}
#live .search-field{background:white;font-size:max(16px,3.8cqw)}

#live .empty-memo{text-align:center;padding-top:19cqw}

#live .note-card{display:flex;flex-direction:column;align-items:stretch;gap:1.6cqw;text-align:left;background:#fff;border:1px solid #d4ddd7;border-radius:4.3cqw;color:var(--ink);padding:3.4cqw;min-height:35.3cqw;overflow:hidden;overflow-wrap:anywhere}
#live .note-card strong{font-size:4cqw;line-height:1.3}
#live .note-card span,#live .note-card small{font-size:3.2cqw;color:var(--muted)}
#live .note-card span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

#live .erase-note{color:#aa514c;background:var(--paper);font-size:3.4cqw}

#live .record-action.primary,#live .local-count{background:var(--green);color:white}
#live .local-count{border-radius:18cqw;display:grid;place-items:center;font-size:3.3cqw;font-weight:650;pointer-events:none}
#live .audio-list{display:flex;flex-direction:column;gap:1.7cqw;background:var(--paper);overflow:auto}
#live .audio-card{border:1px solid #d5dcd4;border-radius:4cqw;display:flex;align-items:center;gap:3cqw;background:#fff;padding:3.6cqw}
#live .audio-card strong,#live .audio-card small{display:block;font-size:4cqw}
#live .audio-card small{font-size:3.2cqw;color:var(--muted);margin-top:1cqw}
#live .play-sample{font-size:4cqw;border:0;border-radius:3.6cqw;background:#dcebe4;padding:2.5cqw;color:var(--green)}
.stage{position:relative}

 nav .launch{grid-column:1 / -1}
 nav .launch h2{display:none}

}

  .page{padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}

    const input=field('textarea','빠른 메모 내용',quickText,'메모 작성 — 내용만 적으면 돼요');

    place(input,5.25,13.65,89.5,21.8);
    const count=place(el('span','count-label'),4.1,36.8,24,3.5);
    function update() {quickText=input.value; count.textContent=quickText.length+'/2000';}
    input.addEventListener('input',update); update();
    const save=hits.querySelector('[data-dest="MemosFilled"]'); if(save)save.remove();
    const b=makeBtn('저장',()=>saveNote(null,'',input.value),'over-button clear-btn');
    b.setAttribute('aria-label','빠른 메모 저장'); place(b,81.9,0,18.1,6.4);
    return;
  }
  if (id==='MemoEdit' || id==='MemoFilled') {
    const data=activeNote(id); const recordId=data.id;
    const title=field('input','메모 제목',data.title,'제목'); title.maxLength=80; title.className+=' title-field';
    const body=field('textarea','메모 본문',data.body,'내용을 입력하세요'); body.className+=' body-field';
    place(title,5.9,6.4,88.2,6.1); place(body,5.9,13.0,88.2,72);
    hits.replaceChildren();
    const save=()=>saveNote(recordId,title.value,body.value);
    const complete=makeBtn('완료',save,'over-button clear-btn'); place(complete,82,0,18,6.4);
    const prev=makeBtn('',()=>{ if(title.value.trim()||body.value.trim())save(); else back();},'over-button'); prev.setAttribute('aria-label','메모 목록으로'); place(prev,0,0,13,6.4);
    const keyboard=makeBtn('',()=>body.focus(),'over-button'); keyboard.setAttribute('aria-label','키보드로 본문 입력'); place(keyboard,2,86.5,12,7);
    if (data.id && data.id !== 'example') {
      const del=makeBtn('삭제',()=>{
        if (!window.confirm('이 시연 메모를 삭제할까요?')) return;
        const index=notes.findIndex(n=>n.id===recordId);
        if(index>=0)notes.splice(index,1);
        put('notes',notes); editingId=null; go('Memos'); toast('메모를 삭제했어요.');
      },'over-button erase-note');
      place(del,84,92.5,14,7);
    }
    return;
  }
  if (id!=='Memos' && id!=='MemosFilled') return;
  const sample = id==='MemosFilled' && notes.length===0;
  const data = sample ? [sampleNote] : notes;
  hits.querySelector('[data-dest="MemoFilled"]')?.remove();
  const search=field('input','메모 검색',memoSearch,'메모 검색');
  search.className+=' search-field'; search.type='search'; place(search,13.0,8.85,77,4.9);
  const summary=place(el('span','memo-count'),4,22.8,52,5);
  const sorter=makeBtn('',()=>{sortOld=!sortOld;paint();},'sort-notes');
  place(sorter,57,22.7,39,5.3);
  const content=place(el('div','note-items'),3.9,29.0,92.2,57.5);
  function paint() {
    const needle=memoSearch.trim().toLocaleLowerCase();
    const found=data.filter(n=>[n.title,n.body].some(s=>s.toLocaleLowerCase().includes(needle)));
    const sorted=sortOld ? [...found].reverse() : found;
    summary.textContent='메모 '+found.length+'개';
    sorter.textContent=sortOld?'↕ 오래된 순  ☰':'↕ 최근 수정순  ☰';
    content.replaceChildren();
    if (!sorted.length) {
      const empty=el('div','empty-memo');
      empty.append(el('strong','',needle?'검색 결과가 없어요':'아직 메모가 없어요'),el('small','',needle?'다른 검색어를 입력해 보세요':'오른쪽 아래 + 를 눌러 첫 메모를 남겨 보세요'));
      content.append(empty); return;
    }
    const grid=el('div','note-grid'); content.append(grid);
    for (const n of sorted) {
      const card=makeBtn('',()=>{editingId=n.id;put('selected-note',n.id);go('MemoFilled');},'note-card');
      const when=n.updated ? new Date(n.updated).toLocaleDateString('ko-KR',{month:'long',day:'numeric'}):'시연 예시';
      card.setAttribute('aria-label',n.title+' 메모 열기');
      card.append(el('strong','',n.title),el('span','',n.body),el('small','',when)); grid.append(card);
    }
  }
  search.addEventListener('input',()=>{memoSearch=search.value;paint();});
  paint();
}

let recordedSince=null;
const recs=get('records',[]);
function secondsText(ms) {
  const sec=Math.max(0,Math.floor(ms/1000));
  return [Math.floor(sec/60),sec%60].map(v=>String(v).padStart(2,'0')).join(':');
}
function stopRecord() {
  recs.unshift({started:recordedSince, ms:Math.max(0, Date.now()-recordedSince)});
  recordedSince=null;
  put('records',recs);
}
function renderRecord(id) {
  if (id==='HomeRecording') {
    const clock=place(el('span','record-clock'),6,89.8,88,4.35);
    const update=()=>{clock.textContent='녹음 중 '+secondsText(Date.now()-recordedSince)+' · 눌러서 종료';};
    update(); clockTimer=setInterval(update,250);
    return;
  }
  if(id==='RecordSaved'){
    const length = recs.length ? secondsText(recs[0].ms):'00:03';
    const info=place(el('span','record-info',length+' · 파일 보관함에 보관돼요'),12,34.9,75,4.2);
    const listen=makeBtn('▶  듣기',()=>toast('녹음 시간만 기록하는 시연입니다. 저장된 음성은 없어요.'),'record-action');
    place(listen,12.4,39.3,75.1,6.4);
    const transcribe=makeBtn('텍스트로 정리하기',()=>toast('음성 인식은 서버에 연결한 앱에서 사용할 수 있어요.'),'record-action primary');
    place(transcribe,12.4,47.0,75.1,6.4);
    return;
  }
  if (!['Files','FilesFilled'].includes(id) || !recs.length) return;
  const list=place(el('div','audio-list'),3.8,25.6,92.4,72.8);
  const total=place(el('span','local-count','▣  로컬 '+recs.length),4.1,8.8,21.6,5.1);
  for(const rec of recs) {
    const date=new Date(rec.started), card=el('div','audio-card');
    const play=makeBtn('▷',()=>toast('시연 기록에는 음성이 포함되지 않습니다.'),'play-sample');
    play.setAttribute('aria-label','녹음 기록 안내');
    const text=el('div');
    text.append(el('strong','','녹음 '+date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})),el('small','',secondsText(rec.ms)+' · 이 기기에 저장된 시연 기록'));
    card.append(play,text);list.append(card);
  }
}

      const box=make('div','cal-field',label);box.append(chips(choices,k,opts,data[k]||def));form.append(box);

    form.append(make('small','cal-sub','알림 설정은 저장만 되고, 실제 알림은 추후 지원돼요.'));
    const [ownerField,owner]=field('담당자','text',data.assignee,'담당자'),[placeField,loc]=field('장소','text',data.place,'장소'),[descField,desc]=field('설명','textarea',data.desc,'설명');
    const project=make('div','cal-field','프로젝트');project.append(make('small','cal-sub','만들어 둔 프로젝트가 없어요. 프로젝트 메뉴에서 먼저 만들어 주세요.'));
    const error=make('span','cal-error');error.setAttribute('role','alert');
    const submit=make('button','cal-primary','저장하기');submit.type='submit';
    form.append(ownerField,placeField,project,descField,error,submit);
    form.addEventListener('submit',ev=>{
      ev.preventDefault();
      if(!title.value.trim()||!date.value){error.textContent='제목과 날짜를 입력해 주세요.';return}
      if(end.value&&(!start.value||end.value<=start.value)){error.textContent='끝나는 시간은 시작 시간보다 뒤여야 해요.';return}
      const t={...data,...choices,id:data.id||(globalThis.crypto?.randomUUID?.()||'task-'+Date.now()+'-'+Math.random().toString(36).slice(2)),title:title.value.trim(),date:date.value,start:start.value,end:end.value,assignee:owner.value.trim(),place:loc.value.trim(),desc:desc.value.trim()};
      saveTask(t);select(dateFrom(t.date));editId=null;staged=null;go(returnTo);
    });
  }
  function taskList(route){
    const n=panel(7.05),list=tasks();
    if(route==='TasksFilled'&&!list.length)list.push({...sample});
    function draw(){
      n.replaceChildren();
      const bar=make('div','cal-chips cal-list-chips');n.append(bar);
      ['전체','오늘','예정','임박','초과','완료'].forEach(v=>{
        const count=list.filter(t=>v==='전체'||phase(t)===v).length;
        const b=button(v+' '+count,()=>{filter=v;draw()},'cal-pill'+(filter===v?' cal-on':''));b.setAttribute('aria-pressed',String(filter===v));bar.append(b);
      });
      const add=button('＋ 할 일 추가',()=>{selected=today();editor(null,'Tasks')},'cal-add');add.style.justifyContent='center';add.style.background='#dcebe6';add.style.color=green;add.style.fontWeight='700';n.append(add);
      const items=make('div','cal-list');n.append(items);
      const visible=list.filter(t=>filter==='전체'||phase(t)===filter);
      if(!visible.length)items.append(make('p','cal-empty','해당하는 항목이 없어요'));
      visible.forEach(t=>items.append(taskRow(t,'Tasks',()=>{list.splice(0,list.length,...tasks());draw()})));
    }
    draw();
  }
  return function renderCalendarRoute(id){
    const prior=last;last=id;
    const cal=id==='Calendar'||id==='HomeCalendar', list=id==='Tasks'||id==='TasksFilled', form=id==='TaskEdit'||id==='TaskFilled';
    if(!cal&&!list&&!form)return;
    css();
    document.querySelectorAll('#hits button').forEach(hit=>{
      const cutoff=cal?(id==='Calendar'?5.77:33.98):list?7.05:0;
      if(!cutoff || parseFloat(hit.style.top)>=cutoff)hit.remove();
    });
    if(cal){if(prior!==id)pickerYear=null;calendar(id);return}
    if(list){taskList(id);return}
    if(!returnTo||!['Calendar','HomeCalendar','Tasks','TasksFilled'].includes(prior)){
      returnTo='Tasks';
      if(prior!==id){staged=null;editId=null}
    }
    if(id==='TaskEdit'){editId=null;staged=null}
    if(id==='TaskFilled'&&!editId){staged=tasks()[0]||{...sample};editId=staged.id}
    edit();
  };
})();

$('group').append(...groups.map(([title])=>opt(title,title)));
$('group').onchange=()=>go(groups.find(([name])=>name===$('group').value)[1][0][0]);
$('jump').onchange=e=>go(e.target.value);
$('back').onclick=back;
$('hints').onclick=()=>{
  const show=$('scene').classList.toggle('show');
  $('hints').setAttribute('aria-pressed',String(show)); $('hints').textContent=show?'연결 위치 숨기기':'연결 위치 표시';
};
for(const [id,name] of [['Home','홈'],['QuickInput','메모 쓰기'],['Calendar','일정 추가'],['Login','로그인·권한']]){
  $('trials').append(makeBtn(name,()=>go(id)));
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !e.defaultPrevented && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){ e.preventDefault();back(); }
});
let startRoute='';
try{startRoute=decodeURIComponent(location.hash.slice(1));}catch{}
go(all[startRoute]?startRoute:'Home',false);
</script></body></html>
