name: Android recording preview

on:
  push:
    branches: [codex/android-recording]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-recording-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

defaults:
  run:
    shell: bash
    working-directory: frontend/Frontend_UI

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/Frontend_UI/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run local, integration and mobile tests
        working-directory: .
        run: |
          npm ci --prefix tests/sync-verify --ignore-scripts --no-audit --no-fund
          node --test backend/local/tests/*.test.mjs tests/integration/*.test.mjs frontend/Frontend_UI/tests/*.test.cjs
      - name: Export web and Android bundles
        run: npx --no-install expo export --platform web --platform android --max-workers 2

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PREVIEW_PACKAGE: com.dbrdid.atria.recordingpreview
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/Frontend_UI/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make room on the hosted runner and install Android build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Verify the published APK used as the comparison
        run: |
          tools="$ANDROID_HOME/build-tools/37.0.0"
          official="$RUNNER_TEMP/Atria-0.0.4.apk"
          curl --fail --silent --show-error --location --retry 3 --output "$official" \
            'https://github.com/dbrdid/AI_Assistant/releases/download/v0.0.4/Atria-0.0.4.apk'
          echo "4810761ecec21b056c317d7d90ddf84c19242e21b23c76eacc1e8fd41f8c10cf  $official" | sha256sum --check
          "$tools/aapt" dump badging "$official" > "$RUNNER_TEMP/official.badging"
          java -cp "$tools/lib/apksigner.jar" "$GITHUB_WORKSPACE/.github/scripts/ApkSigners.java" "$official" > "$RUNNER_TEMP/official.certs"
          cat "$RUNNER_TEMP/official.certs"
      - run: npm ci --no-audit --no-fund
      - name: Generate the isolated test application
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.name = 'Atria 녹음 테스트';
          config.expo.scheme = 'atria-recording-preview';
          config.expo.android.package = process.env.PREVIEW_PACKAGE;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          NODE
          npx --no-install expo prebuild --platform android --no-install
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview.jks" -storetype JKS \
            -alias androiddebugkey -storepass android -keypass android -keyalg RSA \
            -keysize 2048 -validity 365 -dname "CN=Atria Recording Preview"
          keytool -exportcert -keystore "$RUNNER_TEMP/preview.jks" -storepass android \
            -alias androiddebugkey -file "$RUNNER_TEMP/preview-public.der"
      - name: Build the standalone arm64 APK
        working-directory: frontend/Frontend_UI/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Verify application IDs, signatures and bundled audio resources
        run: |
          tools="$ANDROID_HOME/build-tools/37.0.0"
          output="$GITHUB_WORKSPACE/preview-artifact"
          mkdir -p "$output"
          apk="$output/Atria-recording-preview-arm64.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/preview.jks" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false \
            --out "$apk" android/app/build/outputs/apk/release/app-release.apk
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/preview.badging"
          java -cp "$tools/lib/apksigner.jar" "$GITHUB_WORKSPACE/.github/scripts/ApkSigners.java" "$apk" > "$RUNNER_TEMP/preview.certs"
          application_id() { sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/$1.badging"; }
          official_id=$(application_id official)
          preview_id=$(application_id preview)
          official_cert=$(paste -sd, "$RUNNER_TEMP/official.certs")
          preview_cert=$(cat "$RUNNER_TEMP/preview.certs")
          expected_cert=$(sha256sum "$RUNNER_TEMP/preview-public.der" | cut -d' ' -f1)
          printf 'Published app %s (%s) and preview %s (%s)\n' "$official_id" "$official_cert" "$preview_id" "$preview_cert"
          if [[ -z "$official_id" || "$preview_id" != "$PREVIEW_PACKAGE" || "$preview_id" == "$official_id" ]]; then
            echo "::error::Preview APK does not have a separate application ID"
            exit 1
          fi
          if [[ "$preview_cert" != "$expected_cert" ]] || grep -Fxq "$preview_cert" "$RUNNER_TEMP/official.certs"; then
            echo "::error::Preview APK does not have a separate signing certificate"
            exit 1
          fi
          grep -q "android.permission.RECORD_AUDIO" "$RUNNER_TEMP/preview.badging"
          grep -E "^application(-label:|: label=)'Atria 녹음 테스트'" "$RUNNER_TEMP/preview.badging"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/preview.entries"
          grep -qx 'assets/index.android.bundle' "$RUNNER_TEMP/preview.entries"
          grep -q '^lib/arm64-v8a/.*\.so$' "$RUNNER_TEMP/preview.entries"
          (cd "$output" && sha256sum Atria-recording-preview-arm64.apk | tee SHA256SUMS.txt)
          {
            printf '### Android recording preview\n\n'
            printf '| APK | Application ID | Signing certificate SHA-256 |\n| --- | --- | --- |\n'
            printf '| v0.0.4 | `%s` | `%s` |\n' "$official_id" "$official_cert"
            printf '| Recording preview | `%s` | `%s` |\n\n' "$preview_id" "$preview_cert"
            cat "$output/SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Atria-recording-preview-arm64
          path: preview-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
