name: Local backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/local/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
