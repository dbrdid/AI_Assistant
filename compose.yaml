services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL}
      AI_AUTH_TOKENS: ${AI_AUTH_TOKENS:?Set AI_AUTH_TOKENS}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - ollama
    stop_grace_period: 40s
  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    volumes:
      - models:/root/.ollama
    # Internal network only; do not publish model runtime to the internet.
volumes:
  models:
